<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIHSS Research | OmniBase</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- React, ReactDOM, Framer Motion, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] } } }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans antialiased h-screen overflow-hidden selection:bg-sky-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS ---
        const Icon = ({ path }) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={path}/></svg>;
        const SearchIcon = () => <Icon path="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />;
        const XIcon = () => <Icon path="M18 6L6 18M6 6l12 12" />;

        // --- DEEP PIHSS DATABASE ---
        const DATA = [
            { 
                id: 1, type: "school", title: "Pakistan Islamia Higher Secondary School", sub: "Al Ghubaiba, Sharjah (Pakistani Curriculum)", 
                desc: "Established in 1974, PIHSS is the largest Pakistani curriculum school in the UAE, serving over 2,500 students. In its 2025 SPEA review, the school's overall effectiveness improved from 'Acceptable' to 'Good', with notable advancements in Kindergarten, Primary, and High phases. The school is accredited by the Federal Board of Intermediate and Secondary Education (FBISE) and emphasizes a culturally rich, secure environment.",
                stats: { "SPEA Rating": "Good (2025)", "Founded": "1974", "Curriculum": "Pakistani (FBISE)", "Location": "Al Ghubaiba, Sharjah", "Students": "2,538", "Language": "English" } 
            },
            { 
                id: 2, type: "school", title: "Academic Performance", sub: "SPEA Inspection Results", 
                desc: "According to the February 2025 SPEA report, students' achievement in science is good overall. Internal data shows outstanding attainment in KG, good in Primary and Middle, and very good in High. In FBISE examinations, Grade 9 attainment is good, while Grades 10, 11, and 12 are very good. The school also participates in international benchmarking (CAT4, IBT, TIMSS), with IBT results rated very good in Primary and outstanding in Middle and High.",
                stats: { "Science": "Good", "KG Attainment": "Outstanding", "FBISE Gr 10-12": "Very Good", "IBT (Middle/High)": "Outstanding", "TIMSS 2023": "Below UAE Avg" } 
            },
            { 
                id: 3, type: "school", title: "Student Wellbeing & Conduct", sub: "Personal Development", 
                desc: "Students demonstrate very strong personal and social development, exhibiting positive attitudes, self-reliance, and effective conflict resolution. The school has a rigorous code of conduct based on Respect, Consideration, and Responsibility. Attendance is high, and students actively contribute to environmental sustainability projects. The SPEA report rated personal and social development as 'Very Good'.",
                stats: { "SPEA Rating": "Very Good", "Code of Conduct": "3 Pillars", "Attendance": "96% Target", "Safeguarding": "Rigorous", "Sustainability": "Active Clubs" } 
            },
            { 
                id: 4, type: "school", title: "Campus & Facilities", sub: "Al Ghubaiba Infrastructure", 
                desc: "The campus operates on a double-shift system (Morning: Girls KG-12 & Boys KG-4; Afternoon: Boys 4-12) and features separate facilities for boys and girls from Class 4 onwards. Facilities include specialized labs for Physics, Chemistry, Biology, and Computer Science, a library with ~10,000 books, a 300-capacity auditorium, a Creative Lab for coding, and an Inclusion Room added in 2026. A standout feature is the on-site medical clinic with a full-time doctor and nurses.",
                stats: { "Medical Clinic": "Doctor & Nurses", "Library": "10,000 Books", "Labs": "Science & Computer", "Auditorium": "300 Capacity", "Sports": "Cricket, Football, Basketball" } 
            },
            { 
                id: 5, type: "school", title: "Leadership & Governance", sub: "Management Structure", 
                desc: "Led by Principal Syed Najaf Ali Shah and governed by a Board chaired by H.E. Ali Al Hosani, the school has a low staff turnover rate of just 6.45%. The SPEA review noted the school has a rigorous self-evaluation process and data-driven decision-making. Parental partnerships are considered a key strength, with a dedicated Parents Portal (Orison) and active parent surveys.",
                stats: { "Principal": "Syed Najaf Ali Shah", "Staff Turnover": "6.45%", "Teacher Ratio": "1:19", "Parent Portal": "Orison", "Governance": "SPEA Oversight" } 
            },
            { 
                id: 6, type: "school", title: "Special Educational Needs (SEN)", sub: "Inclusion Support", 
                desc: "The school has an Inclusion Room and policies for Special Educational Needs, but the 2025 SPEA report noted that identification and provision for SEN and Gifted & Talented (G&T) students remain inconsistent. There are currently 48 students with special educational needs. The school is working on developing the inclusion department to ensure consistent levels of support.",
                stats: { "SEN Students": "48", "Inclusion Room": "Added 2026", "G&T Support": "Inconsistent", "SPEA Focus": "Improvement Needed", "Support Staff": "10 Assistants" } 
            },
            { 
                id: 7, type: "school", title: "Fees & Value", sub: "Affordable Education", 
                desc: "PIHSS offers one of the lowest fee structures in Sharjah, ranging from AED 4,500 to AED 8,000 annually (plus transport). This is significantly below the Sharjah-wide average of AED 41,253. The school provides discounts for orphans (50%) and siblings. The fee structure is designed to provide global competencies at the lowest possible cost for the Pakistani community.",
                stats: { "Fee Range": "AED 4.5K - 8K", "Sharjah Avg": "AED 41,253", "Transport": "AED 300-330/mo", "Sibling Discount": "Yes", "Orphan Discount": "50%" } 
            }
        ];

        function App() {
            const [search, setSearch] = useState("");
            const [selected, setSelected] = useState(null);

            const filtered = useMemo(() => {
                return DATA.filter(item => {
                    const q = search.toLowerCase();
                    return (item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q));
                });
            }, [search]);

            return (
                <div className="flex h-screen bg-zinc-950 font-sans">
                    {/* SIDEBAR */}
                    <aside className="w-64 border-r border-zinc-800 bg-zinc-900 flex flex-col hidden md:flex">
                        <div className="p-6">
                            <h1 className="text-2xl font-black text-zinc-100 tracking-tighter">PIHSS<span className="text-sky-500">RESEARCH</span></h1>
                            <p className="text-xs text-zinc-500 mt-1 font-mono">Al Ghubaiba, Sharjah</p>
                        </div>
                        <div className="px-4 space-y-2 flex-grow">
                            <p className="px-4 text-xs font-bold text-zinc-600 uppercase mb-2">Research Modules</p>
                            {DATA.map(d => (
                                <button key={d.id} onClick={() => setSelected(d)} className={`w-full text-left px-4 py-3 rounded-xl font-medium transition-all text-sm ${selected?.id === d.id ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20' : 'text-zinc-500 hover:text-zinc-200 hover:bg-zinc-800'}`}>
                                    {d.title}
                                </button>
                            ))}
                        </div>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-grow flex flex-col h-full overflow-hidden">
                        {/* HEADER */}
                        <header className="glass px-6 py-4 flex items-center justify-between h-20">
                            <div className="relative w-full max-w-md ml-auto">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center text-zinc-500"><SearchIcon /></div>
                                <input type="text" placeholder="Search PIHSS research..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-12 pr-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-zinc-100 placeholder-zinc-500 outline-none text-sm transition-all" />
                            </div>
                        </header>

                        {/* GRID */}
                        <div className="flex-grow overflow-y-auto p-6 md:p-8">
                            <h2 className="text-2xl font-bold text-zinc-100 mb-6">PIHSS Research Data ({filtered.length})</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 pb-20">
                                {filtered.map((item, idx) => (
                                    <motion.div key={item.id} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: idx * 0.05 }} whileHover={{ y: -4 }} onClick={() => setSelected(item)} className="cursor-pointer bg-zinc-900 rounded-2xl p-6 border border-zinc-800 hover:border-sky-500/50 transition-colors shadow-lg">
                                        <span className="px-2 py-1 text-[10px] font-bold uppercase rounded bg-zinc-800 text-sky-400">{item.type}</span>
                                        <h3 className="text-xl font-bold text-zinc-100 mt-4 mb-2">{item.title}</h3>
                                        <p className="text-sm text-zinc-500 font-mono mb-4">{item.sub}</p>
                                        <p className="text-sm text-zinc-400 line-clamp-3 mb-6">{item.desc}</p>
                                        {Object.entries(item.stats).slice(0, 2).map(([k, v]) => (
                                            <div key={k} className="flex justify-between text-sm border-b border-zinc-800 pb-1 mt-2">
                                                <span className="text-zinc-600">{k}</span><span className="font-semibold text-zinc-300">{v}</span>
                                            </div>
                                        ))}
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* MODAL */}
                    <AnimatePresence>
                        {selected && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 flex justify-end bg-zinc-950/80 backdrop-blur-sm">
                                <div className="absolute inset-0" onClick={() => setSelected(null)}></div>
                                <motion.div initial={{ x: "100%" }} animate={{ x: 0 }} exit={{ x: "100%" }} transition={{ type: "spring", damping: 25, stiffness: 200 }} className="relative w-full max-w-xl h-full bg-zinc-900 border-l border-zinc-800 shadow-2xl flex flex-col">
                                    <div className="p-8 border-b border-zinc-800">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className="px-3 py-1 text-xs font-bold uppercase rounded bg-sky-500/20 text-sky-400 border border-sky-500/30">PIHSS Research</span>
                                                <h2 className="text-3xl font-extrabold text-zinc-100 mt-4">{selected.title}</h2>
                                                <p className="text-sky-400 font-mono mt-1">{selected.sub}</p>
                                            </div>
                                            <button onClick={() => setSelected(null)} className="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-zinc-400"><XIcon /></button>
                                        </div>
                                    </div>
                                    <div className="p-8 overflow-y-auto flex-grow">
                                        <h3 className="text-xs font-bold text-zinc-600 uppercase tracking-widest mb-3 border-b border-zinc-800 pb-2">Detailed Analysis</h3>
                                        <p className="text-lg leading-relaxed text-zinc-300 mb-8">{selected.desc}</p>
                                        <h3 className="text-xs font-bold text-zinc-600 uppercase tracking-widest mb-4 border-b border-zinc-800 pb-2">Data Matrix</h3>
                                        <div className="grid grid-cols-2 gap-4">
                                            {Object.entries(selected.stats).map(([k, v]) => (
                                                <div key={k} className="bg-zinc-950 p-4 rounded-xl border border-zinc-800">
                                                    <div className="text-xs text-zinc-500 mb-1">{k}</div><div className="font-bold text-zinc-200">{v}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="p-6 border-t border-zinc-800 bg-zinc-950/50">
                                        <button onClick={() => setSelected(null)} className="w-full py-4 bg-sky-500 hover:bg-sky-400 text-zinc-900 font-bold rounded-xl">Close Research</button>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
